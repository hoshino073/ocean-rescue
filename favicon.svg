<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sea" cx="50%" cy="30%" r="80%">
      <stop offset="0" stop-color="#0d6b8f"/>
      <stop offset="0.55" stop-color="#073a52"/>
      <stop offset="1" stop-color="#041b2d"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd3c0"/>
      <stop offset="1" stop-color="#2f8f5e"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background so it works as a Windows tile and a maskable icon -->
  <rect width="512" height="512" fill="url(#sea)"/>

  <!-- Light rays -->
  <path d="M150 0 L210 0 L170 512 L90 512 Z" fill="#d7f6f9" opacity="0.06"/>
  <path d="M300 0 L340 0 L380 512 L320 512 Z" fill="#d7f6f9" opacity="0.05"/>

  <!-- Bubbles -->
  <circle cx="392" cy="128" r="14" fill="none" stroke="#d7f6f9" stroke-width="5" opacity="0.7"/>
  <circle cx="420" cy="88" r="8" fill="none" stroke="#d7f6f9" stroke-width="4" opacity="0.6"/>
  <circle cx="404" cy="58" r="5" fill="#d7f6f9" opacity="0.5"/>

  <g transform="translate(256 276)">
    <!-- Front flippers -->
    <path d="M-78 -60 C-150 -110 -190 -100 -178 -70 C-168 -44 -120 -30 -70 -20 Z" fill="#2fb4c9"/>
    <path d="M78 -60 C150 -110 190 -100 178 -70 C168 -44 120 -30 70 -20 Z" fill="#2fb4c9"/>
    <!-- Rear flippers: the right one is the coral-colored prosthetic -->
    <path d="M-62 82 C-120 128 -128 166 -102 170 C-78 174 -52 136 -36 104 Z" fill="#2fb4c9"/>
    <path d="M62 82 C120 128 128 166 102 170 C78 174 52 136 36 104 Z" fill="#ff8a65"/>
    <rect x="76" y="132" width="34" height="11" rx="5" transform="rotate(-50 93 137)" fill="#d7f6f9"/>
    <!-- Tail -->
    <path d="M-10 118 L0 146 L10 118 Z" fill="#2fb4c9"/>
    <!-- Head -->
    <ellipse cx="0" cy="-128" rx="36" ry="42" fill="#2fb4c9"/>
    <circle cx="-15" cy="-140" r="6" fill="#041b2d"/>
    <circle cx="15" cy="-140" r="6" fill="#041b2d"/>
    <!-- Shell -->
    <ellipse cx="0" cy="12" rx="104" ry="124" fill="url(#shell)" stroke="#d7f6f9" stroke-width="8"/>
    <g fill="none" stroke="#d7f6f9" stroke-width="6" stroke-linejoin="round" opacity="0.75">
      <path d="M0 -50 L34 -28 L34 14 L0 36 L-34 14 L-34 -28 Z"/>
      <path d="M0 -50 L0 -108 M34 -28 L84 -58 M34 14 L94 36 M0 36 L0 132 M-34 14 L-94 36 M-34 -28 L-84 -58"/>
    </g>
  </g>
</svg>
